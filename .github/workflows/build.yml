name: Build macOS plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # needed to attach the zip to a release when a v* tag is pushed

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: "Configure (universal binary: Apple Silicon + Intel)"
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: DSP tests
        run: ./build/EngineTest

      - name: Sign (ad-hoc) and package
        run: |
          ART="build/TwentyFourShimmers_artefacts/Release"
          mkdir -p "dist/24 Shimmers"
          cp -R "$ART/VST3/24 Shimmers.vst3" "$ART/AU/24 Shimmers.component" "dist/24 Shimmers/"
          for b in "dist/24 Shimmers/"*; do codesign --force --deep --sign - "$b"; done
          cp packaging/install.command packaging/INSTALL.txt "dist/24 Shimmers/"
          chmod +x "dist/24 Shimmers/install.command"
          # ditto keeps the executable bits that a plain artifact upload would strip.
          ditto -c -k --keepParent "dist/24 Shimmers" "dist/24-Shimmers-mac.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 24-Shimmers-mac
          path: dist/24-Shimmers-mac.zip

      - name: Validate Audio Unit
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "dist/24 Shimmers/24 Shimmers.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Sh24 Thie

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/24-Shimmers-mac.zip
